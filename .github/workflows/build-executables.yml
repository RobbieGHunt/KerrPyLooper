name: Build Cross-Platform Executables (Nuitka)

on:
  push:
    branches:
      - main
      - feat/nuitka-packaging
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit & Packaging Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: KerrPyLooper-Windows-x64
          - os: macos-latest
            artifact_name: KerrPyLooper-macOS
          - os: ubuntu-latest
            artifact_name: KerrPyLooper-Linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            ccache \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install Python dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka zstandard ordered-set

      - name: Build executable with Nuitka
        run: python build_nuitka.py --onefile

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "suite_launcher.app" ]; then
            mv suite_launcher.app KerrPyLooper.app
            ditto -c -k --sequesterRsrc --keepParent KerrPyLooper.app KerrPyLooper-macOS.zip
          elif [ -d "KerrPyLooper.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent KerrPyLooper.app KerrPyLooper-macOS.zip
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/KerrPyLooper*
            !dist/*.build/**
            !dist/*.dist/**
            !dist/*.onefile-build/**

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
